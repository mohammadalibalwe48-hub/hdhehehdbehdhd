name: lessons_mobile
description: "Studies — Arabic lesson scheduler (Flutter), same Supabase backend as the web app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  google_fonts: ^6.3.2
  intl: ^0.20.2
  flutter_svg: ^2.0.10+1
  shared_preferences: ^2.3.2
  collection: ^1.18.0

  # Offline-first: local SQLite cache + write queue + Supabase Realtime push.
  sqflite: ^2.4.0
  path_provider: ^2.1.5
  path: ^1.9.0
  uuid: ^4.5.1
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/banner.png
    - assets/icon_square.png

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon_square_white.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon_foreground.png"
  remove_alpha_ios: false

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/banner.png
  android_12:
    image: assets/icon_square.png
    color: "#FFFFFF"
  color_dark: "#0B1518"
  image_dark: assets/banner.png
  android: true
  ios: false
  web: false
  fullscreen: false
  android_gravity: center

